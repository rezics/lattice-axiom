# cargo-deny configuration.
#
# Besides license and advisory auditing, this file mechanically enforces the
# facade boundaries from the architecture docs: backend crates (wgpu, winit,
# rocksdb) may only ever be direct dependencies of their dedicated facade
# implementation crates. A violation fails CI instead of relying on review.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained *transitive* dependencies are upstream's to replace; we still
# fail on unmaintained direct dependencies and on actual vulnerabilities.
unmaintained = "workspace"
ignore = [
  # The accepted demo stack explicitly selects bincode inside project-owned,
  # versioned envelopes. RUSTSEC-2025-0141 reports project discontinuation,
  # not a vulnerability, and offers no safe upgrade. Re-evaluate this narrow
  # exception at the next serialization-baseline milestone.
  { id = "RUSTSEC-2025-0141", reason = "accepted envelope-only demo baseline; no safe upgrade exists" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
confidence-threshold = 0.9
# Workspace crates are unpublished and their license is still undecided
# (tracked in README); auditing applies to external dependencies.
private = { ignore = true }
# Copyleft/font terms are accepted only at the dependency boundaries that need
# them: Nickel's immutable vectors and arbitrary-precision evaluator numbers,
# plus egui's bundled default fonts. Do not promote these to the global allow
# list without a separate distribution review.
exceptions = [
  { allow = ["MPL-2.0"], crate = "bitmaps@3.2.1" },
  { allow = ["MPL-2.0"], crate = "imbl-sized-chunks@0.1.3" },
  { allow = ["LGPL-3.0-only"], crate = "malachite@0.9.2" },
  { allow = ["LGPL-3.0-only"], crate = "malachite-base@0.9.2" },
  { allow = ["LGPL-3.0-only"], crate = "malachite-float@0.9.2" },
  { allow = ["LGPL-3.0-only"], crate = "malachite-nz@0.9.2" },
  { allow = ["LGPL-3.0-only"], crate = "malachite-q@0.9.2" },
  { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts@0.36.1" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version by design; Cargo.lock pins them.
allow-wildcard-paths = true

# --- Facade boundary enforcement -------------------------------------------
# `wrappers` lists the only crates allowed to depend on the banned crate
# directly. Extend the wrapper lists deliberately (e.g. egui-wgpu/egui-winit at
# milestone 3) instead of weakening the ban.

[[bans.deny]]
name = "wgpu"
reason = "GPU access is confined to the render backend crate (ADR 0006)."
wrappers = ["egui-wgpu", "latticeaxiom-render-wgpu"]

[[bans.deny]]
name = "winit"
reason = "Windowing and input are host concerns; only the demo host may use winit."
wrappers = ["egui-winit", "latticeaxiom-demo"]

[[bans.deny]]
name = "rocksdb"
reason = "Storage access is confined to the storage backend crate (ADR 0009); arrives at milestone 3."
wrappers = ["latticeaxiom-storage-rocksdb"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
