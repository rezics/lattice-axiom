[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"

# Temporary transitive exception. Production evaluation remains fail-closed;
# replace this dependency instead of extending the deadline silently.
[[advisories.ignore]]
id = "RUSTSEC-2026-0247"
reason = "package=bitmaps@3.2.1; owner=core-runtime-maintainer; added=2026-08-20; expires=2026-09-19; mitigation=trusted import-free Nickel evaluation only and production evaluation remains fail-closed; issue=https://rustsec.org/advisories/RUSTSEC-2026-0247; replace-when=Nickel removes bitmaps or pins a maintained fixedbitset or bitvec replacement"

# Temporary transitive unsoundness exception for the same archived crate. It
# remains separate so replacing or withdrawing either advisory is detectable.
[[advisories.ignore]]
id = "RUSTSEC-2025-0167"
reason = "package=bitmaps@3.2.1; owner=core-runtime-maintainer; added=2026-08-20; expires=2026-09-19; mitigation=production Nickel worker remains fail-closed and controlled trusted evaluation runs in a subprocess whose crash is isolated and reaped by the supervisor; issue=https://github.com/bodil/bitmaps/issues/35; replace-when=Nickel removes bitmaps or pins a maintained fixedbitset or bitvec replacement"

# Temporary build-time proc-macro exception inherited through Nickel.
[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "package=paste@1.0.15; owner=core-runtime-maintainer; added=2026-08-20; expires=2026-09-19; mitigation=build-time proc macro only with exact locked source version and checksum; issue=https://rustsec.org/advisories/RUSTSEC-2024-0436; replace-when=Nickel replaces paste with pastey or with_builtin_macros or stops resolving paste"

# Temporary client-only exception inherited through Bevy and winit.
[[advisories.ignore]]
id = "RUSTSEC-2026-0192"
reason = "package=ttf-parser@0.25.1; owner=core-runtime-maintainer; added=2026-08-20; expires=2026-09-19; mitigation=transitive Wayland client-decoration path is not executed by headless CI and stays under the Bevy upgrade gate; issue=https://github.com/harfbuzz/ttf-parser/issues/217; replace-when=Bevy or winit replaces ttf-parser with skrifa or stops resolving the client-decoration path"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
# Keep the workspace on a narrow, explicit set of permissive dependency
# licenses. Alternatives in compound SPDX expressions only need one allowed
# branch, so LGPL is intentionally not accepted globally.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Nickel's persistent vector and arbitrary-precision numeric implementation
# require these scoped copyleft exceptions; do not widen them globally.
exceptions = [
  { allow = ["MPL-2.0"], crate = "bitmaps@3.2.1" },
  # Leafwing 0.21 uses dyn-eq without modification; the exact crates.io checksum is verified by release evidence.
  { allow = ["MPL-2.0"], crate = "dyn-eq@0.1.3" },
  { allow = ["MPL-2.0"], crate = "imbl-sized-chunks@0.1.3" },
  { allow = ["LGPL-3.0-only"], crate = "malachite@0.9.2" },
  { allow = ["LGPL-3.0-only"], crate = "malachite-base@0.9.2" },
  { allow = ["LGPL-3.0-only"], crate = "malachite-float@0.9.2" },
  { allow = ["LGPL-3.0-only"], crate = "malachite-nz@0.9.2" },
  { allow = ["LGPL-3.0-only"], crate = "malachite-q@0.9.2" },
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are private and do not yet publish package-level license
# metadata. Dependencies remain subject to the allowlist above.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
