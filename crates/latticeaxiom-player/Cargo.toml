[package]
name = "latticeaxiom-player"
description = "Fixed-tick player, action, and authoritative block-edit integration for Lattice Axiom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Leafwing is a static client adapter only. Headless and portable consumers use
# PlayerActionFrameV1 directly and do not compile platform input support.
client-input = [
  "bevy/keyboard",
  "bevy/mouse",
  "dep:leafwing-input-manager",
  "leafwing-input-manager/gamepad",
  "leafwing-input-manager/keyboard",
  "leafwing-input-manager/mouse",
]

[dependencies]
# Rendering, picking, scene loading, and Avian's debug plugin are deliberately
# absent so this composition remains valid for headless command-input tests.
avian3d = { workspace = true, default-features = false, features = ["3d", "default-collider", "f32", "parallel", "parry-f32"] }
bevy = { workspace = true, features = ["bevy_log", "multi_threaded", "std"] }
latticeaxiom-gameplay = { path = "../latticeaxiom-gameplay" }
latticeaxiom-input.workspace = true
leafwing-input-manager = { workspace = true, optional = true, default-features = false }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
