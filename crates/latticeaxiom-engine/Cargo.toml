[package]
name = "latticeaxiom-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
default-run = "latticeaxiom-engine"

[features]
# Dynamic linking makes iterative Bevy builds substantially faster. Disable
# default features for a statically linked distributable build.
default = ["client", "development"]
client = [
  "bevy/3d",
  "bevy/audio",
  "bevy/bevy_settings",
  "bevy/default_font",
  "bevy/keyboard",
  "bevy/mouse",
  "bevy/ui",
  "latticeaxiom-player/client-input",
]
development = ["client", "bevy/dynamic_linking"]

[[bin]]
name = "latticeaxiom-engine"
path = "src/main.rs"
required-features = ["client"]

[[bin]]
name = "latticeaxiom-playable-fixture"
path = "src/bin/playable_fixture.rs"
required-features = ["client"]

[[bin]]
name = "latticeaxiom-play"
path = "src/bin/latticeaxiom_play.rs"
required-features = ["client"]

[dependencies]
avian3d = { workspace = true, default-features = false, features = ["3d", "default-collider", "f32", "parallel", "parry-f32"] }
bevy.workspace = true
latticeaxiom-client-ui = { path = "../latticeaxiom-client-ui" }
latticeaxiom-compose = { path = "../latticeaxiom-compose" }
latticeaxiom-content = { path = "../latticeaxiom-content" }
latticeaxiom-core = { path = "../latticeaxiom-core" }
latticeaxiom-gameplay = { path = "../latticeaxiom-gameplay" }
latticeaxiom-input = { path = "../latticeaxiom-input" }
latticeaxiom-launcher = { path = "../latticeaxiom-launcher" }
latticeaxiom-packages = { path = "../latticeaxiom-packages" }
latticeaxiom-player = { path = "../latticeaxiom-player" }
latticeaxiom-registration = { path = "../latticeaxiom-registration" }
latticeaxiom-runtime-contracts = { path = "../latticeaxiom-runtime-contracts" }
latticeaxiom-start-ui = { path = "../latticeaxiom-start-ui" }
latticeaxiom-storage = { path = "../latticeaxiom-storage" }
latticeaxiom-voxel-mesh = { path = "../latticeaxiom-voxel-mesh" }
latticeaxiom-voxel-runtime = { path = "../latticeaxiom-voxel-runtime" }
latticeaxiom-world-catalog = { path = "../latticeaxiom-world-catalog" }
latticeaxiom-world-db = { path = "../latticeaxiom-world-db" }
latticeaxiom-world-wire = { path = "../latticeaxiom-world-wire" }
latticeaxiom-worldgen = { path = "../latticeaxiom-worldgen" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
