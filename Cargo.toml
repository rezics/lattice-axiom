[workspace]
resolver = "3"
members = [
  "crates/latticeaxiom-abi",
  "crates/latticeaxiom-compose",
  "crates/latticeaxiom-content",
  "crates/latticeaxiom-core",
  "crates/latticeaxiom-engine",
  "crates/latticeaxiom-gameplay",
  "crates/latticeaxiom-launcher",
  "crates/latticeaxiom-packages",
  "crates/latticeaxiom-player",
  "crates/latticeaxiom-registration",
  "crates/latticeaxiom-render-contracts",
  "crates/latticeaxiom-runtime-contracts",
  "crates/latticeaxiom-sdk",
  "crates/latticeaxiom-sdk-macros",
  "crates/latticeaxiom-start-ui",
  "crates/latticeaxiom-storage",
  "crates/latticeaxiom-territory",
  "crates/latticeaxiom-voxel-mesh",
  "crates/latticeaxiom-voxel-playground",
  "crates/latticeaxiom-voxel-runtime",
  "crates/latticeaxiom-world-catalog",
  "crates/latticeaxiom-world-db",
  "crates/latticeaxiom-world-wire",
  "crates/latticeaxiom-worldgen",
]
default-members = ["crates/latticeaxiom-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/rezics/lattice-axiom-demo"

[workspace.dependencies]
# ADR 0014 fixes the implementation baseline at Bevy 0.19.x. Cargo.lock is
# the authoritative dependency record, so upgrades are deliberate migrations.
avian3d = { version = "=0.7.0", default-features = false }
bevy = "=0.19.1"
bevy_voxel_world = "=0.17.0"
criterion = "0.8"
hex = "0.4.3"
leafwing-input-manager = { version = "=0.21.0", default-features = false }
malachite-base = "=0.9.2"
nickel-lang-core = { version = "=0.18.0", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
proptest = "1.9"
quote = "1.0.47"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full", "parsing"] }
thiserror = "2.0.20"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.24.1", features = ["v4"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
print_stdout = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

# Bevy's official development profile: optimize project code lightly and
# dependencies heavily so the debug build remains playable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
