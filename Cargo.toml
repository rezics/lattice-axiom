[workspace]
resolver = "3"
members = [
  "crates/latticeaxiom-compose",
  "crates/latticeaxiom-core",
  "crates/latticeaxiom-engine",
]
default-members = ["crates/latticeaxiom-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
repository = "https://github.com/rezics/lattice-axiom-demo"

[workspace.dependencies]
# ADR 0014 fixes the implementation baseline at Bevy 0.19.x. Cargo.lock is
# the authoritative dependency record, so upgrades are deliberate migrations.
bevy = "=0.19.1"
hex = "0.4.3"
malachite-base = "=0.9.2"
nickel-lang-core = { version = "=0.18.0", default-features = false }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.24.1", features = ["v4"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
print_stdout = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

# Bevy's official development profile: optimize project code lightly and
# dependencies heavily so the debug build remains playable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
