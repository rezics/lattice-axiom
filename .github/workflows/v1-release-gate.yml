name: V1 release reproduction

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  SOURCE_DATE_EPOCH: "0"

jobs:
  harness-fixture:
    name: Reproduction fixture and pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"
      - name: Run v1 reproduction fixture tests
        run: python scripts/release/test_reproduce.py
      - name: Run v1 dependency-license fixture tests
        run: python scripts/supply-chain/test_v1_dependency_license.py
      - name: Run existing release-evidence fixture corpus
        run: python scripts/supply-chain/test_release_evidence.py
      - name: Validate frozen budgets and action pins
        run: python scripts/release/reproduce.py validate

  linux-x86_64:
    name: Linux x86_64 v1 gate
    needs: [harness-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V1_MATRIX_ID: linux-x86_64-release
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bevy system dependencies
        timeout-minutes: 10
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          g++ pkg-config libx11-dev libasound2-dev libudev-dev
          libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev
      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install exact supply-chain tools
        timeout-minutes: 15
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo install --locked cargo-about --version 0.9.1 --features cli
      - name: Reproduce ci-headless v1 jobs
        run: >-
          python scripts/release/reproduce.py run
          --profile ci-headless
          --matrix-id linux-x86_64-release
          --output-dir "${{ runner.temp }}/v1-reproduction/linux-x86_64-release"
      - name: Upload normalized Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: latticeaxiom-v1-reproduction-linux-x86_64-release
          path: ${{ runner.temp }}/v1-reproduction/linux-x86_64-release/
          if-no-files-found: error
          retention-days: 90

  windows-x86_64:
    name: Windows x86_64 v1 gate
    needs: [harness-fixture]
    runs-on: windows-2022
    timeout-minutes: 120
    continue-on-error: true
    env:
      V1_MATRIX_ID: windows-x86_64-release
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install exact supply-chain tools
        timeout-minutes: 15
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo install --locked cargo-about --version 0.9.1 --features cli
      - name: Reproduce ci-headless v1 jobs
        run: >-
          python scripts/release/reproduce.py run
          --profile ci-headless
          --matrix-id windows-x86_64-release
          --output-dir "${{ runner.temp }}/v1-reproduction/windows-x86_64-release"
      - name: Upload normalized Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: latticeaxiom-v1-reproduction-windows-x86_64-release
          path: ${{ runner.temp }}/v1-reproduction/windows-x86_64-release/
          if-no-files-found: error
          retention-days: 90

  linux-root-gate:
    name: Linux independent root gate
    if: always()
    needs: [harness-fixture, linux-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Linux v1 jobs
        run: |
          test "${{ needs.harness-fixture.result }}" = "success"
          test "${{ needs.linux-x86_64.result }}" = "success"
