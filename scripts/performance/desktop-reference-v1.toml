# ADR 0026 `desktop-reference-v1` performance profile.
#
# This is the normative product/test performance policy, not a composition
# bootstrap. Composition bootstraps remain `profiles/dev.toml`,
# `profiles/headless.toml`, `profiles/shell.toml`, and `profiles/test.toml`.
# Numbers are the accepted first-version budgets. Changing a threshold,
# percentile, endpoint, or hard-cap failure semantic requires the ADR 0026
# adjustment process. Do not invent easier gates.

schema = 1
profile = "desktop-reference-v1"
document_id = "decision.0026-freeze-first-demo-performance-budgets"
histogram_version = "nearest-rank-v1"
measurement_tool = "latticeaxiom-performance-evidence/v1"
lifecycle_until_reference_host_freeze = "d2-provisional"

[hardware_class]
cpu_physical_cores = 6
cpu_hardware_threads = 12
cpu_isa = "x86-64-avx2"
system_memory_gib = 16
gpu_vram_gib = 6
storage = "local-ssd"
display_width = 1920
display_height = 1080
display_hz = 60
presentation_preset = "medium"

[protocol]
fixed_hz = 60
# 16.67 ms as written in ADR 0026.
fixed_tick_interval_ns = 16670000
