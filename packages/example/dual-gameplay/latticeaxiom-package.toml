schema_version = 1
name = "@example/dual-gameplay"
version = "0.1.0"
domains = ["authoritative"]
trust = "trusted-native"

[realizations.data]
id = "data"
kind = "data"
domains = ["authoritative"]
artifact = { kind = "data-root", path = "crates/latticeaxiom-dual-fixture/tests/fixtures" }
trust = "data-only"

[realizations.native-static]
id = "native-static"
kind = "native-static"
domains = ["authoritative"]
artifact = { kind = "source-build" }
trust = "trusted-native"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = [
  "crates",
  "README.md",

  "latticeaxiom-package.toml",
  "package.ncl",


]

[rust]
entry = "crates/latticeaxiom-dual-fixture/Cargo.toml"
members = ["crates/latticeaxiom-dual-fixture/Cargo.toml"]

[rust.dependencies]
"@latticeaxiom/kernel" = "=0.1.0"
"@latticeaxiom/sdk" = "=0.1.0"
