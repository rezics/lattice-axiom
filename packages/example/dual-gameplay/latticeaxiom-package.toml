schema_version = 1
name = "@example/dual-gameplay"
version = "0.1.0"
domains = ["authoritative"]
trust = "data-only"

[realizations.data]
id = "data"
kind = "data"
domains = ["authoritative"]
artifact = { kind = "data-root", path = "tests/fixtures" }
trust = "data-only"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = [
  "Cargo.toml",
  "README.md",
  "benches",
  "latticeaxiom-package.toml",
  "package.ncl",
  "src",
  "tests",
]
