schema_version = 1
name = "terrenia"
version = "0.1.0"
domains = ["authoritative", "client"]
trust = "data-only"

[dependencies.blocks]
package = "@terrenia/blocks"
version = "~0.1.0"
optional = false
domains = ["authoritative"]

[dependencies.worldgen]
package = "@terrenia/worldgen"
version = "~0.1.0"
optional = false
domains = ["authoritative"]

[dependencies.gameplay]
package = "@terrenia/gameplay"
version = "~0.1.0"
optional = false
domains = ["authoritative"]

[dependencies.presentation]
package = "@terrenia/presentation"
version = "~0.1.0"
optional = false
domains = ["client"]

[requires."latticeaxiom:capability/content-blocks@1"]
capability = "latticeaxiom:capability/content-blocks@1"
version = "^1.0.0"
provider = "@terrenia/blocks"
cardinality = "exactly-one"
domains = ["authoritative"]

[requires."latticeaxiom:capability/worldgen-terrain-provider@2"]
capability = "latticeaxiom:capability/worldgen-terrain-provider@2"
version = "^2.0.0"
provider = "@terrenia/worldgen"
cardinality = "exactly-one"
domains = ["authoritative"]

[realizations.data]
id = "data"
kind = "data"
domains = ["authoritative", "client"]
artifact = { kind = "data-root", path = "data" }
trust = "data-only"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = ["package.ncl", "latticeaxiom-package.toml"]
