schema_version = 1
name = "@terrenia/gameplay"
version = "0.1.0"
domains = ["authoritative"]
trust = "data-only"

[dependencies.blocks]
package = "@terrenia/blocks"
version = "~0.1.0"
optional = false
domains = ["authoritative"]

[requires."latticeaxiom:capability/content-blocks@1"]
capability = "latticeaxiom:capability/content-blocks@1"
version = "^1.0.0"
provider = "@terrenia/blocks"
cardinality = "exactly-one"
domains = ["authoritative"]

[realizations.data]
id = "data"
kind = "data"
domains = ["authoritative"]
artifact = { kind = "data-root", path = "data" }
trust = "data-only"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = ["package.ncl", "latticeaxiom-package.toml", "data"]
