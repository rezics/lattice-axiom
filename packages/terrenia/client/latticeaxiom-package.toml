schema_version = 1
name = "@terrenia/client"
version = "0.1.0"
domains = ["authoritative", "client", "server", "tool"]
trust = "trusted-native"

[realizations.native-static]
id = "native-static"
kind = "native-static"
domains = ["authoritative", "client", "server", "tool"]
artifact = { kind = "source-build" }
trust = "trusted-native"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = ["latticeaxiom-package.toml", "package.ncl", "crates"]

[rust]
entry = "crates/latticeaxiom-engine/Cargo.toml"
members = ["crates/latticeaxiom-engine/Cargo.toml"]
binaries = ["latticeaxiom-engine", "latticeaxiom-play"]

[rust.dependencies]
"@latticeaxiom/webview" = "=0.1.0"
"@latticeaxiom/client-ui" = "=0.1.0"
"@latticeaxiom/front-end" = "=0.1.0"
"@latticeaxiom/gameplay" = "=0.1.0"
"@latticeaxiom/host" = "=0.1.0"
"@latticeaxiom/input" = "=0.1.0"
"@latticeaxiom/kernel" = "=0.1.0"
"@latticeaxiom/launcher" = "=0.1.0"
"@latticeaxiom/sdk" = "=0.1.0"
"@latticeaxiom/settings-ui" = "=0.1.0"
"@latticeaxiom/voxel" = "=0.1.0"
"@latticeaxiom/world" = "=0.1.0"
"@latticeaxiom/world-library" = "=0.1.0"
"@terrenia/worldgen" = "=0.1.0"

[web.dependencies]
"@latticeaxiom/web-ui" = "=0.1.0"
