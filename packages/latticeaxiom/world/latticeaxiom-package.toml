schema_version = 1
name = "@latticeaxiom/world"
version = "0.1.0"
domains = ["authoritative", "client", "server", "tool"]
trust = "trusted-native"

[realizations.native-static]
id = "native-static"
kind = "native-static"
domains = ["authoritative", "client", "server", "tool"]
artifact = { kind = "source-build" }
trust = "trusted-native"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = ["latticeaxiom-package.toml", "package.ncl", "crates"]

[rust]
entry = "crates/latticeaxiom-storage/Cargo.toml"
members = ["crates/latticeaxiom-storage/Cargo.toml", "crates/latticeaxiom-territory/Cargo.toml", "crates/latticeaxiom-world-db/Cargo.toml", "crates/latticeaxiom-world-wire/Cargo.toml", "crates/latticeaxiom-worldgen/Cargo.toml"]
