schema_version = 1
name = "@latticeaxiom/settings"
version = "0.1.0"
domains = ["client", "server", "tool"]
trust = "data-only"

[provides."latticeaxiom:capability/settings-registry@1"]
capability = "latticeaxiom:capability/settings-registry@1"
version = "1.0.0"
cardinality = "exactly-one"
domains = ["client", "server", "tool"]

[realizations.data]
id = "data"
kind = "data"
domains = ["client", "server", "tool"]
artifact = { kind = "data-root", path = "data" }
trust = "data-only"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = ["package.ncl", "latticeaxiom-package.toml", "data"]
