schema_version = 1
name = "@latticeaxiom/front-end"
version = "0.1.0"
domains = ["client"]
trust = "trusted-native"

[dependencies."world-library"]
package = "@latticeaxiom/world-library"
version = "~0.1.0"
optional = false
domains = ["client"]

[dependencies."settings-ui"]
package = "@latticeaxiom/settings-ui"
version = "~0.1.0"
optional = false
domains = ["client"]

[dependencies.observability]
package = "@latticeaxiom/observability"
version = "~0.1.0"
optional = false
domains = ["client"]

[requires."latticeaxiom:capability/world-catalog@1"]
capability = "latticeaxiom:capability/world-catalog@1"
version = "^1.0.0"
provider = "@latticeaxiom/world-library"
cardinality = "exactly-one"
domains = ["client"]

[requires."latticeaxiom:capability/settings-surface@1"]
capability = "latticeaxiom:capability/settings-surface@1"
version = "^1.0.0"
provider = "@latticeaxiom/settings-ui"
cardinality = "exactly-one"
domains = ["client"]

[requires."latticeaxiom:capability/diagnostic-registry@1"]
capability = "latticeaxiom:capability/diagnostic-registry@1"
version = "^1.0.0"
provider = "@latticeaxiom/observability"
cardinality = "exactly-one"
domains = ["client"]

[provides."latticeaxiom:capability/client-shell@1"]
capability = "latticeaxiom:capability/client-shell@1"
version = "1.0.0"
cardinality = "exactly-one"
domains = ["client"]

[realizations.data]
id = "data"
kind = "data"
domains = ["client"]
artifact = { kind = "data-root", path = "data" }
trust = "data-only"

[realizations.native-static]
id = "native-static"
kind = "native-static"
domains = ["client"]
artifact = { kind = "source-build" }
trust = "trusted-native"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = [
  "crates",
  "README.md",
  "data",
  "latticeaxiom-package.toml",
  "package.ncl",


]

[rust]
entry = "crates/latticeaxiom-start-ui/Cargo.toml"
members = ["crates/latticeaxiom-start-ui/Cargo.toml"]

[rust.dependencies]
"@latticeaxiom/client-ui" = "=0.1.0"
"@latticeaxiom/kernel" = "=0.1.0"
"@latticeaxiom/launcher" = "=0.1.0"
"@latticeaxiom/sdk" = "=0.1.0"
"@latticeaxiom/settings-ui" = "=0.1.0"
"@latticeaxiom/world" = "=0.1.0"
"@latticeaxiom/world-library" = "=0.1.0"
