schema_version = 1
name = "@latticeaxiom/settings-ui"
version = "0.1.0"
domains = ["client", "tool"]
trust = "trusted-native"

[dependencies.settings]
package = "@latticeaxiom/settings"
version = "~0.1.0"
optional = false
domains = ["client", "tool"]

[requires."latticeaxiom:capability/settings-registry@1"]
capability = "latticeaxiom:capability/settings-registry@1"
version = "^1.0.0"
provider = "@latticeaxiom/settings"
cardinality = "exactly-one"
domains = ["client", "tool"]

[provides."latticeaxiom:capability/settings-surface@1"]
capability = "latticeaxiom:capability/settings-surface@1"
version = "1.0.0"
cardinality = "exactly-one"
domains = ["client", "tool"]

[realizations.data]
id = "data"
kind = "data"
domains = ["client", "tool"]
artifact = { kind = "data-root", path = "data" }
trust = "data-only"

[realizations.native-static]
id = "native-static"
kind = "native-static"
domains = ["client", "tool"]
artifact = { kind = "source-build" }
trust = "trusted-native"

[nickel_public_entrypoints]
default = "package.ncl"

[source_inclusion]
include = [
  "crates",
  "README.md",
  "data",
  "latticeaxiom-package.toml",
  "package.ncl",


]

[rust]
entry = "crates/latticeaxiom-settings-ui/Cargo.toml"
members = ["crates/latticeaxiom-settings-ui/Cargo.toml"]

[rust.dependencies]
"@latticeaxiom/client-ui" = "=0.1.0"
"@latticeaxiom/kernel" = "=0.1.0"
"@latticeaxiom/sdk" = "=0.1.0"
