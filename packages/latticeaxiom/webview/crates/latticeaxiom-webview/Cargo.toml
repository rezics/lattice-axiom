[package]
name = "latticeaxiom-webview"
description = "Main-thread native WebView transport and bounded offline client assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raw-window-handle = "=0.6.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
percent-encoding = "=2.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "=0.56.1", default-features = false, features = ["os-webview"] }
windows = { version = "=0.61.3", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true
winit = { workspace = true, features = ["rwh_06"] }

[lints]
workspace = true

[package.metadata.latticeaxiom]
owner = "@latticeaxiom/webview"
